<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>

      <section id="currency-container">
        <h3>Currency Converter</h3>
        <form id="currency-form">
          <div class="form-group">
            <label for="amount">Amount:</label>
            <input type="number" id="amount" required min="0.01" step="any" placeholder="Enter amount" />
          </div>
          <div class="form-group">
            <label for="from-currency">From Currency:</label>
            <select id="from-currency" required>
              <option value="">-- Select currency --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="to-currency">To Currency:</label>
            <select id="to-currency" required>
              <option value="">-- Select currency --</option>
            </select>
          </div>
          <button type="submit">Convert</button>
        </form>
        <div id="conversion-result" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
